services:
  nginx:
    depends_on:
      - wordpress
    build:
      context: ./requirements/nginx
      args:
        ALPINE_IMAGE: ${ALPINE_IMAGE}
    ports:
    - "443:443"
    restart: on-failure

  wordpress:
    depends_on:
      - mariadb
    build:
      context: ./requirements/wordpress
      args:
        ALPINE_IMAGE: ${ALPINE_IMAGE}
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html

  mariadb:
    build:
      context: ./requirements/mariadb
      args:
        ALPINE_IMAGE: ${ALPINE_IMAGE}
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
  wordpress_data: